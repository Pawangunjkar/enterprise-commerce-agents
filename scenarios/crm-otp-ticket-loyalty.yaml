id: crm-otp-ticket-loyalty
agent: crm
title: OTP identity, KYC, DPDP consent, ticket, loyalty, abandonment
business: >
  Assisted-sales desk verifies mobile OTP, persists KYC, records DPDP consent, opens a ticket,
  reads festival loyalty, autofill address, and marks cart abandonment — operational CRM end to end.

steps:
  - id: otp
    call: customer-360-service.otp_start
    args:
      mobile: "9999999999"
  - id: verify
    call: customer-360-service.otp_verify
    args:
      mobile: "9999999999"
      otp: "123456"
  - id: profile
    call: customer-360-service.upsert_profile
    args:
      mobile: "9999999999"
      pan: "ABCDE1234F"
      gstin: "27ABCDE1234F1Z5"
      name: "Priya Sharma"
  - id: read
    call: customer-360-service.get_profile
    args:
      mobile: "9999999999"
  - id: consent
    call: dpdp-compliance-service.record_consent
    args:
      payload:
        customerId: "9999999999"
        purpose: ORDER_FULFILLMENT
        granted: true
  - id: ticket
    call: support-ticket-service.create_ticket
    args:
      payload:
        subject: Delivery slot change
        customerId: "9999999999"
        channel: ASSISTED
  - id: loyalty
    call: loyalty-rewards-service.get_loyalty
    args:
      customerId: "9999999999"
      festivalMultiplier: 1.5
  - id: address
    call: contact-address-service.autofill_address
    args:
      pincode: "110001"
  - id: abandon
    call: cart-abandonment-service.mark_abandoned
    args:
      payload:
        customerId: "9999999999"
        cartId: CART-DEL-110001
        reason: ASSISTED_CALLBACK
